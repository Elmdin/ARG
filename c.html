<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm appointment</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
<style>
  [hidden] { display: none !important; }
  section { padding: 24px 0; }
  .btn { min-height: 52px; font-size: 1.1rem; width: 100%; }
  input { min-height: 52px; font-size: 18px; }
  .big { font-size: 1.4rem; font-weight: 800; margin: 4px 0; }
  .card { margin: 14px 0; }
  .card p { margin: 6px 0; }
  .msg { border-radius: 12px; padding: 16px; margin: 14px 0; font-weight: 700; font-size: 1.1rem; }
  .msg.ok { background: #12301f; border: 2px solid #1f8f5f; }
  .msg.err { background: #3b1414; border: 2px solid #d94848; }
</style></head>
<body><main class="wrap" style="max-width:560px">
<section>
  <p class="eyebrow" id="studio">&nbsp;</p>
  <h2 id="head">Loading…</h2>
  <div id="details"></div>
  <form id="f" class="form" hidden>
    <label>Type your full name to accept<input name="name" autocomplete="name" required></label>
    <button class="btn" type="submit" id="accept">Accept</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
</section></main>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (iso) => new Date(iso).toLocaleString([], { weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
const stamp = (iso) => new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
let v;
function show(state, at) {
  $("f").hidden = true;
  const r = $("result");
  if (state === "accepted") r.innerHTML = `<div class="msg ok" id="done">Confirmed. Accepted on ${esc(stamp(at))}. See you then!</div>`;
  else if (state === "won") r.innerHTML = `<div class="msg ok" id="done">It's yours! Booked on ${esc(stamp(at))}. The studio will see it right away.</div>`;
  else if (state === "taken") r.innerHTML = `<div class="msg err" id="taken">Sorry, it's taken. Someone else accepted this spot first. You're still on the waitlist.</div>`;
  else if (state === "lapsed") r.innerHTML = `<div class="msg err">The confirmation deadline has passed. Please call the studio to keep your spot.</div>`;
  else if (state === "cancelled") r.innerHTML = `<div class="msg err">This appointment was cancelled. Please contact the studio.</div>`;
  else { $("f").hidden = false; r.innerHTML = ""; }
}
(async () => {
  try {
    const r = await fetch("/api/confirm?t=" + encodeURIComponent(T));
    v = await r.json();
    if (!r.ok) throw new Error(v.error || "This link isn't valid.");
    document.title = v.studio;
    $("studio").textContent = v.studio;
    $("head").textContent = v.kind === "offer" ? `A spot opened up, ${v.name.split(" ")[0]}` : `Confirm your appointment, ${v.name.split(" ")[0]}`;
    $("details").innerHTML = `<div class="card">
      <p class="big">${esc(v.treatment)}${v.price ? " · $" + Number(v.price).toLocaleString() : ""}</p>
      <p class="big">${esc(when(v.at))}</p>
      ${v.kind === "confirm" ? `<p>Please accept by <b>${esc(when(v.cutoff))}</b> to keep this time.</p>` : `<p>First to accept gets it.</p>`}
      ${v.terms ? `<p class="terms">${esc(v.terms)}</p>` : ""}
      ${v.deposit ? `<p><b>Deposit: $${Number(v.deposit).toLocaleString()}.</b> ${esc(v.depositTerms || "")}</p>` : ""}
    </div>`;
    show(v.state, v.acceptedAt);
  } catch (e) { $("head").textContent = "Link problem"; $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
})();
$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = ev.target.name.value.trim();
  if (!name) return $("result").innerHTML = `<div class="msg err">Please type your name to accept.</div>`;
  $("accept").disabled = true;
  try {
    const r = await fetch("/api/confirm", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "accept", t: T, name }) });
    const j = await r.json();
    if (j.state) return show(j.state, j.acceptedAt);
    throw new Error(j.error || "Couldn't save. Please try again.");
  } catch (e) { $("result").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; $("accept").disabled = false; }
});
</script></body></html>
