<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Quotax HQ</title><link rel="stylesheet" href="styles.css">
<style>
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#0f0f15;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit}
.tabs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,transparent)}
.pane{display:none}.pane.on{display:block}
.item{border-top:1px solid var(--line);padding:12px 0}.item h4{margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.st{font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:999px;text-transform:uppercase;background:#26263a;white-space:nowrap}
.st.won,.st.live{background:#12392b;color:#3ddc97}.st.talking,.st.queued{background:#3d3113;color:#f5c451}.st.building{background:#13283d;color:#6db7ff}
.st.in.review{background:#2d1f47;color:#c4a8ff}.st.lost,.st.skip,.st.question{background:#3d1717;color:#ff9a9a}
.item p,.item pre{margin:6px 0 0;color:var(--muted);white-space:pre-wrap;font:inherit}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.counts{display:flex;gap:10px;flex-wrap:wrap}.counts span{background:#0f0f15;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.85rem}
</style></head>
<body><main class="wrap" style="padding:24px 16px 48px">
<h2 style="margin-bottom:4px">Team Quotax HQ</h2>
<p style="color:var(--muted);margin:0">Shared by everyone and every Claude session. Live product: <a href="/app.html">arg-foundergame.vercel.app/app.html</a> · <span id="upd"></span></p>
<div class="tabs"><button data-p="customers" class="on">Customers</button><button data-p="investors">Investors</button><button data-p="convos">Conversations</button><button data-p="queue">Build queue</button><button data-p="notes">Notes</button><button data-p="agents">For Claude</button></div>

<section class="pane on" id="customers">
  <div class="counts" id="counts"></div>
  <form class="card form" id="cf" style="max-width:none;margin-top:12px">
    <div class="grid2">
      <label>Customer (company · buyer)<input name="name" required placeholder="Brightline Window Cleaning · Dana Price"></label>
      <label>Status<select name="status"><option>not contacted</option><option>talking</option><option>building</option><option>in review</option><option>won</option><option>lost</option><option>skip</option></select></label>
      <label>Owner<input name="owner" placeholder="Joseph"></label>
    </div>
    <label>What they need<textarea name="needs" rows="2"></textarea></label>
    <label>Notes<textarea name="notes" rows="2"></textarea></label>
    <button class="btn" type="submit">Save customer</button>
  </form>
  <div id="clist"></div>
</section>

<section class="pane" id="investors">
  <div class="counts" id="icounts"></div>
  <form class="card form" id="vf" style="max-width:none;margin-top:12px">
    <div class="grid2">
      <label>Investor<input name="name" required placeholder="Whale Capital · Sam Lee"></label>
      <label>Status<select name="status"><option>not contacted</option><option>pitched</option><option>interested</option><option>terms</option><option>closed</option><option>passed</option></select></label>
      <label>Owner<input name="owner" placeholder="Orri"></label>
      <label>Amount<input name="amount" placeholder="$50k"></label>
      <label>Valuation<input name="valuation" placeholder="$2M post"></label>
      <label>Equity<input name="equity" placeholder="2.5%"></label>
    </div>
    <label>Conditions / open questions<textarea name="conditions" rows="2"></textarea></label>
    <label>Notes<textarea name="notes" rows="2"></textarea></label>
    <button class="btn" type="submit">Save investor</button>
  </form>
  <div id="vlist"></div>
</section>

<section class="pane" id="convos">
  <form class="card form" id="lf" style="max-width:none;margin-top:12px">
    <div class="grid2">
      <label>Who (customer or investor)<input name="party" required></label>
      <label>Kind<select name="kind"><option>customer</option><option>investor</option></select></label>
      <label>Channel<input name="channel" placeholder="game chat / DM / in person"></label>
      <label>Logged by<input name="author" placeholder="Joseph / Claude sales-A"></label>
    </div>
    <label>What was said<textarea name="said" rows="3" required></textarea></label>
    <label>What we promised (price, feature, deadline, terms)<textarea name="promised" rows="2"></textarea></label>
    <button class="btn" type="submit">Log conversation</button>
  </form>
  <h3>Commitments we made</h3><div id="plist"></div>
  <h3>Log</h3><div id="llist"></div>
</section>

<section class="pane" id="queue">
  <form class="card form" id="af" style="max-width:none;margin-top:12px">
    <label>Customer<input name="customer" placeholder="Dana Price · Brightline"></label>
    <label>Their exact request / review feedback<textarea name="text" rows="4" required></textarea></label>
    <button class="btn" type="submit">Send to builder</button>
  </form>
  <div id="alist"></div>
</section>

<section class="pane" id="notes">
  <form class="card form" id="nf" style="max-width:none;margin-top:12px">
    <div class="grid2"><label>Title<input name="title" placeholder="Dossier summary / investor notes / decision"></label><label>Author<input name="author" placeholder="Orri / Joseph / Imaan / Claude"></label></div>
    <label>Body<textarea name="body" rows="5" required></textarea></label>
    <button class="btn" type="submit">Add note</button>
  </form>
  <div id="nlist"></div>
</section>

<section class="pane" id="agents"><div class="card" style="margin-top:12px">
  <h3>Paste this into any Claude session</h3>
  <pre id="agentprompt" style="white-space:pre-wrap;color:var(--muted);font:13px/1.5 ui-monospace,monospace"></pre>
</div></section>
<p id="m" style="color:var(--muted)"></p>
</main>
<script>
const k = new URLSearchParams(location.search).get("k") || "";
const api = "/api/hq?k=" + encodeURIComponent(k);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button,.pane").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); document.getElementById(b.dataset.p).classList.add("on");
});
const base = location.origin;
document.getElementById("agentprompt").textContent =
`You are working for Team Quotax in The Founder Game. Our shared HQ is the single source of truth.
1. Read the current state first: ${base}/api/hq?k=${k}&format=md
2. Save what you learn so everyone sees it (open these URLs; values must be URL-encoded):
   - Customer update: ${base}/api/hq?k=${k}&op=customer&name=COMPANY&status=talking&needs=WHAT_THEY_NEED&notes=NOTES&owner=WHO
     (status: not contacted | talking | building | in review | won | lost | skip)
   - Note (dossier summary, investor intel, decision): ${base}/api/hq?k=${k}&op=note&title=TITLE&author=YOUR_ROLE&body=TEXT
   - Investor update: ${base}/api/hq?k=${k}&op=investor&name=FIRM&status=interested&amount=AMT&valuation=VAL&equity=PCT&conditions=TERMS&owner=WHO
     (status: not contacted | pitched | interested | terms | closed | passed)
   - Log EVERY customer/investor exchange: ${base}/api/hq?k=${k}&op=log&party=NAME&kind=customer&said=SUMMARY&promised=ANYTHING_WE_COMMITTED_TO&channel=WHERE&author=YOU
   - Claim a record before working it (parallel agents): add &agent=YOUR_AGENT_NAME to a customer/investor update. Skip records another agent claimed in the last 15 min.
   - Feature request for the builder: ${base}/api/hq?k=${k}&op=ask&customer=COMPANY&text=EXACT_REQUEST
3. Or use the forms at ${base}/hq.html?k=${k}
Live product to send customers: ${base}/app.html
Never post this key anywhere public.`;
async function post(body) {
  const r = await fetch("/api/hq", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...body, k }) });
  document.getElementById("m").textContent = r.ok ? "Saved." : "Save failed: " + (await r.text());
  load();
}
document.getElementById("cf").onsubmit = (e) => { e.preventDefault(); post({ type: "customer", ...Object.fromEntries(new FormData(e.target)) }); e.target.reset(); };
document.getElementById("af").onsubmit = (e) => { e.preventDefault(); post({ type: "ask", ...Object.fromEntries(new FormData(e.target)) }); e.target.reset(); };
document.getElementById("vf").onsubmit = (e) => { e.preventDefault(); post({ type: "investor", ...Object.fromEntries(new FormData(e.target)) }); e.target.reset(); };
document.getElementById("lf").onsubmit = (e) => { e.preventDefault(); post({ type: "log", ...Object.fromEntries(new FormData(e.target)) }); e.target.reset(); };
document.getElementById("nf").onsubmit = (e) => { e.preventDefault(); post({ type: "note", ...Object.fromEntries(new FormData(e.target)) }); e.target.reset(); };
async function load() {
  const r = await fetch(api);
  if (r.status === 403) { document.getElementById("clist").textContent = "Missing team key: use the full HQ link."; return; }
  const s = await r.json();
  document.getElementById("upd").textContent = "updated " + new Date().toLocaleTimeString();
  const order = ["talking","building","in review","won","not contacted","lost","skip"];
  const cs = s.customers.slice().sort((a,b) => order.indexOf(a.status) - order.indexOf(b.status));
  const cnt = {}; s.customers.forEach((c) => cnt[c.status] = (cnt[c.status] || 0) + 1);
  document.getElementById("counts").innerHTML = Object.entries(cnt).map(([k,v]) => `<span>${esc(k)}: <b>${v}</b></span>`).join("") || "<span>No customers yet</span>";
  document.getElementById("clist").innerHTML = cs.map((c) => `<div class="item"><h4><span>${esc(c.name)}${c.owner ? ` <span style="color:var(--muted);font-weight:400">· ${esc(c.owner)}</span>` : ""}${c.agent ? ` <span style="color:var(--muted);font-weight:400">· 🤖 ${esc(c.agent)}</span>` : ""}</span><span class="st ${esc(c.status)}">${esc(c.status)}</span></h4>${c.needs ? `<p><b>Needs:</b> ${esc(c.needs)}</p>` : ""}${c.notes ? `<p>${esc(c.notes)}</p>` : ""}</div>`).join("");
  const inv = s.investors || [], logs = s.convos || [];
  const ic = {}; inv.forEach((v) => ic[v.status] = (ic[v.status] || 0) + 1);
  document.getElementById("icounts").innerHTML = Object.entries(ic).map(([k,v]) => `<span>${esc(k)}: <b>${v}</b></span>`).join("") || "<span>No investors yet</span>";
  document.getElementById("vlist").innerHTML = inv.map((v) => `<div class="item"><h4><span>${esc(v.name)}${v.owner ? ` <span style="color:var(--muted);font-weight:400">· ${esc(v.owner)}</span>` : ""}${v.agent ? ` <span style="color:var(--muted);font-weight:400">· 🤖 ${esc(v.agent)}</span>` : ""}</span><span class="st">${esc(v.status)}</span></h4>${["amount","valuation","equity","conditions","notes"].filter((f) => v[f]).map((f) => `<p><b>${f}:</b> ${esc(v[f])}</p>`).join("")}</div>`).join("");
  const row = (l) => `<div class="item"><h4><span>${esc(l.party)} <span style="color:var(--muted);font-weight:400">· ${esc(l.kind)}${l.channel ? " · " + esc(l.channel) : ""}${l.author ? " · " + esc(l.author) : ""}</span></span><span style="color:var(--muted);font-weight:400;font-size:.8rem">${new Date(l.at).toLocaleTimeString()}</span></h4><pre>${esc(l.said)}</pre>${l.promised ? `<p><b>Promised:</b> ${esc(l.promised)}</p>` : ""}</div>`;
  document.getElementById("plist").innerHTML = logs.filter((l) => l.promised).reverse().map(row).join("") || "<p>None logged.</p>";
  document.getElementById("llist").innerHTML = logs.slice().reverse().map(row).join("") || "<p>No conversations logged.</p>";
  document.getElementById("alist").innerHTML = s.asks.slice().reverse().map((a) => `<div class="item"><h4><span>#${a.id} ${esc(a.customer || "Customer")}</span><span class="st ${esc(a.status)}">${a.status === "live" ? "✅ live, send for review" : esc(a.status)}</span></h4>${a.note ? `<p><b>Builder:</b> ${esc(a.note)}</p>` : ""}<pre>${esc(a.text)}</pre></div>`).join("") || "<p>Queue empty.</p>";
  document.getElementById("nlist").innerHTML = s.notes.slice().reverse().map((n) => `<div class="item"><h4><span>${esc(n.title)}</span><span style="color:var(--muted);font-weight:400;font-size:.8rem">${esc(n.author)} · ${new Date(n.at).toLocaleTimeString()}</span></h4><pre>${esc(n.body)}</pre></div>`).join("") || "<p>No notes yet.</p>";
}
load(); setInterval(load, 5000);
</script></body></html>
