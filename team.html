<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Team inbox · Quotax</title><link rel="stylesheet" href="styles.css">
<style>
  form.card, .ask { padding: 16px; margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  textarea { min-height: 140px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .8rem; font-weight: 700; text-transform: uppercase; }
  .s-new { background: #5a3d00; color: #ffd27a; } .s-building { background: #1d3a66; color: #9cc7ff; }
  .s-live { background: #12452a; color: #8ff0b5; } .s-dropped { background: #333; color: #aaa; }
  .ask pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0; font: inherit; color: var(--fg); }
  .note { color: #8ff0b5; } .meta { color: var(--muted); font-size: .85rem; }
  #msg { min-height: 1.4em; }
</style></head>
<body><main class="wrap"><section>
<p class="eyebrow">Team only</p><h2>Customer asks &amp; reviews</h2>
<p class="lead">Paste what a customer asked for, or the result of a review. Claude picks it up within seconds, builds it, deploys it, and marks it <b>live</b> here. Only click "Send for review" once it says live.</p>
<form class="card" id="f">
  <label for="customer">Customer (company · person)</label>
  <input id="customer" placeholder="Brightline Window Cleaning · Dana Price">
  <label for="kind">Type</label>
  <select id="kind"><option value="ask">Customer ask (what they want built)</option><option value="review">Review result (what passed / failed)</option></select>
  <label for="text">Paste their exact words</label>
  <textarea id="text" placeholder="Paste the chat message or the full review here…"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn" type="submit">Send to Claude</button><span id="msg" role="status"></span></div>
</form>
<div id="list">Loading…</div>
</section></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
async function load() {
  try {
    const r = await fetch("/api/asks"); const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    $("list").innerHTML = d.asks.map((a) => `<div class="card ask">
      <div class="row"><span class="chip s-${a.status}">${a.status}</span><b>${esc(a.customer) || "Unknown customer"}</b><span class="meta">${a.kind} · ${new Date(a.at).toLocaleTimeString()}</span></div>
      <pre>${esc(a.text)}</pre>${a.note ? `<div class="note">Claude: ${esc(a.note)}</div>` : ""}
      ${a.status !== "dropped" ? `<button class="btn btn-ghost" data-drop="${a.id}">Drop</button>` : ""}</div>`).join("") || "<p>Nothing yet.</p>";
  } catch (e) { $("list").textContent = "Could not load: " + e.message; }
}
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const body = { customer: $("customer").value, kind: $("kind").value, text: $("text").value };
  if (!body.text.trim()) { $("msg").textContent = "Paste their words first."; return; }
  $("msg").textContent = "Sending…";
  const r = await fetch("/api/asks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  $("msg").textContent = r.ok ? "Sent. Watch for it to turn live." : "Failed: " + (await r.text());
  if (r.ok) { $("text").value = ""; load(); }
};
$("list").onclick = async (e) => {
  const id = e.target.dataset.drop; if (!id) return;
  await fetch("/api/asks", { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, status: "dropped" }) });
  load();
};
load(); setInterval(load, 5000);
</script></body></html>
